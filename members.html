<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Екип | VandBHome</title>
<meta name="description" content="Екипът на VandBHome – брокери, кредитни и правни консултанти по градове (измислени имена за демонстрация).">
<meta name="theme-color" content="#0B2F36">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="wrap"><span class="eyebrow">Екип</span><h1 style="font-size:clamp(2rem,4.5vw,3.2rem)" data-c="pages.members.title">Запознай се с нашите брокери</h1><p data-c="pages.members.lead"></p></div></section>
<section><div class="wrap">
  <div class="pop" id="m-filter" style="margin-bottom:28px"><a href="#" data-c="" class="on-chip">Всички</a><a href="#" data-c="София">София</a><a href="#" data-c="Пловдив">Пловдив</a><a href="#" data-c="Варна">Варна</a><a href="#" data-c="Бургас">Бургас</a></div>
  <div class="team" id="team" data-list="team"></div>
</div></section>
<section class="cta"><div class="wrap"><h2>Искаш да станеш част от екипа?</h2><div class="cta-row"><a class="btn btn-sun" href="/careers">Кариери</a><a class="btn btn-ghost light" href="/stipendii">Стипендии</a></div></div></section>
</main>
<div id="site-footer"></div>
<script src="/js/site-defaults.js"></script>
<script src="/js/common.js"></script>
<script>(function(){var f=document.getElementById('m-filter');f.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;e.preventDefault();var c=a.dataset.c;f.querySelectorAll('a').forEach(function(x){x.classList.toggle('on-chip',x===a)});document.querySelectorAll('#team .member').forEach(function(m){m.hidden=c&&m.dataset.city!==c})})})()</script>
</body>
</html>
