<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кариери | VandBHome</title>
<meta name="description" content="Присъедини се към екипа на VandBHome: отворени позиции за брокери, кредитни консултанти и маркетинг. Кандидатствай онлайн.">
<meta name="theme-color" content="#0B2F36">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="wrap"><span class="eyebrow">Кариери</span><h1 style="font-size:clamp(2rem,4.5vw,3.2rem)" data-c="pages.careers.title">Изгради кариера в недвижимите имоти</h1><p data-c="pages.careers.lead"></p></div></section>
<section>
  <div class="wrap two-col">
    <div>
      <h2 style="margin-bottom:24px">Отворени позиции</h2>
      <div class="jobs" data-list="jobs"></div>
      <p class="small" style="margin-top:16px">Позициите са измислени, за демонстрация.</p>
    </div>
    <form class="form-card" id="k-form" novalidate>
      <h2 id="kandidatstvaj" style="font-size:1.6rem">Кандидатствай</h2>
      <label>Позиция<select name="type" id="k-pos"></select></label>
      <label>Град<select name="city"><option value="">Избери град</option><option>София</option><option>Пловдив</option><option>Варна</option><option>Бургас</option><option>Русе</option></select></label>
      <div class="two"><label>Име<input name="name" type="text" autocomplete="name"></label><label>Телефон<input name="phone" type="tel" autocomplete="tel" placeholder="+359 …"></label></div>
      <label>Имейл<input name="email" type="email" autocomplete="email"></label>
      <label>Кратко представяне<textarea name="message" maxlength="800" placeholder="Опит, интереси, защо искаш да работиш с нас…"></textarea></label>
      <label class="check"><input type="checkbox" name="consent"> <span>Съгласен съм с правилата за <a href="/privacy" target="_blank">защита на личните данни</a></span></label><input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-sun" type="submit">Изпрати кандидатурата</button>
      <p class="msg" role="status" hidden></p>
    </form>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="/js/site-defaults.js"></script>
<script src="/js/common.js"></script>
<script src="/js/forms.js"></script>
</body>
</html>
