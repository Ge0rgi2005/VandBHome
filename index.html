<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V&BHome - Недвижими имоти</title> <!-- Запазено име на вашата фирма -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.svg">
</head>
<body>


    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <span class="brand-name">V&BHome</span>
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="active">Начало</a></li>
                    <li><a href="properties.html">Имоти</a></li>
                    <li><a href="new-construction.html">Ново строителство</a></li>
                    <li><a href="blog.html">Блог</a></li>
                    <li><a href="about.html">За нас</a></li>
                    <li><a href="careers.html">Кариери</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1>Открийте Вашия нов дом с нас</h1>
            <p>Първокласни оферти за покупка и наем на недвижими имоти</p>
            

            <div class="property-search-box">
                <div class="search-tabs">
                    <button class="tab-btn active" data-type="buy">Купува</button>
                    <button class="tab-btn" data-type="rent">Наема</button>
                </div>
                <form action="properties.html" method="GET" class="search-form">
                    <div class="form-group">
                        <select name="category">
                            <option value="">Всички имоти</option>
                            <option value="apartment">Апартаменти</option>
                            <option value="house">Къщи</option>
                            <option value="office">Офиси и магазини</option>
                            <option value="land">Парцели</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select name="location">
                            <option value="">Всички населени места</option>
                            <option value="sofia">София</option>
                            <option value="plovdiv">Пловдив</option>
                            <option value="varna">Варна</option>
                            <option value="burgas">Бургас</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-search">Търси</button>
                </form>
            </div>
        </div>
    </section>


    <main class="main-content">
        <section class="container featured-properties">
            <h2>Актуални предложения</h2>
            <div class="properties-grid" id="featured-properties-container">
            </div>
        </section>
    </main>

    <!-- Футър -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 V&BHome. Всички права запазени.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
